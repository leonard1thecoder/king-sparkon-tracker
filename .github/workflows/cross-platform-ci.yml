name: Cross-Platform CI

# Fast validation for the web app and the Expo app. Native release binaries are
# intentionally built by mobile-eas.yml, where EAS credentials are available.
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "mobile/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/cross-platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "mobile/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/cross-platform-ci.yml"

permissions:
  contents: read

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  expo:
    name: Expo (Android, iOS, Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # This project does not yet commit a mobile package-lock.json, so npm ci
      # cannot be used here. Keep this explicit instead of masking npm ci errors.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Export Android, iOS, and web bundles
        env:
          EXPO_PUBLIC_BACKEND_URL: https://example.com
        run: npx expo export --platform all

      - name: Upload Expo export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-dist
          path: mobile/dist
