name: Cross-Platform CI

# Unified pipeline: Next.js web + Expo mobile (Android/iOS via EAS, web via export).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Expo web export
        env:
          EXPO_PUBLIC_BACKEND_URL: https://example.com
        run: npm run build:web

      - name: Upload Expo web dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-dist
          path: mobile/dist
