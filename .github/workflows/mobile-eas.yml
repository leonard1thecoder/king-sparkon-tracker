name: Mobile EAS Build

# Native Android + iOS release binaries via Expo Application Services.
# - Manual: Actions → Mobile EAS Build → Run workflow (pick platform + profile).
# - Release: push a tag like `mobile-v0.1.0` → production build for both platforms.
#
# Requires the repo secret EXPO_TOKEN (an Expo access token).
# iOS production builds additionally need Apple credentials configured
# beforehand via `eas credentials` (preview uses simulator builds instead).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "android"
        type: choice
        options: ["android", "ios", "all"]
      profile:
        description: "EAS build profile (see mobile/eas.json)"
        required: true
        default: "preview"
        type: choice
        options: ["preview", "production", "development"]
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-eas.yml"
    tags: ["mobile-v*"]

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  build-android:
    name: EAS Android build
    needs: validate
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: EAS build (Android)
        env:
          EAS_BUILD_SKIP_LOCKFILE_CHECK: "1"
        run: eas build --non-interactive --platform android --profile ${{ inputs.profile || (startsWith(github.ref, 'refs/tags/') && 'production') || 'preview' }}

  build-ios:
    name: EAS iOS build
    needs: validate
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: EAS build (iOS)
        env:
          EAS_BUILD_SKIP_LOCKFILE_CHECK: "1"
        run: eas build --non-interactive --platform ios --profile ${{ inputs.profile || 'production' }}
